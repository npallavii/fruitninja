# Render Blueprint — deploys Fruitopia as a static site.
# Render dashboard → New → Blueprint → pick this repo. (Or create a Static Site with the same values.)
services:
  - type: web
    runtime: static
    name: fruitopia
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=600
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
